:root{
  color-scheme:dark;
  --bg:#0B1833; --card:#12294D; --card2:#1B3A68; --ink:#F4F5F7; --mut:#A9BAD6; --line:#2A4672;
  --acc:#FEE438; --acc-ink:#0B1833; --ok:#3FD17F; --bad:#FF5566;
  --blue:#2F8FFF; --cyan:#4FD0FF; --red:#E8102A; --turf:#2A6238;
  --disp:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom))}
h1,h2,h3,.disp{font-family:var(--disp);font-style:italic;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0}
h1{font-size:40px;font-weight:800}
h2{font-size:26px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center}
h2::before{content:"";flex:none;width:9px;height:22px;background:var(--acc);transform:skewX(-14deg);margin-right:11px}
p{margin:0 0 10px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.mut{color:var(--mut)} .small{font-size:14px}

/* en-tête */
.top{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:10px}
.back{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:20px}
.top .ttl{flex:1;min-width:0}
.top .ttl small{display:block;color:var(--mut);font-size:13px}
.top .ttl b{font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase;font-size:25px;line-height:1.1;display:block}
.brand{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.brand .logo{font-family:var(--disp);font-style:italic;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.01em}
.brand .logo i{font-style:normal;color:var(--acc)}
.lvl{font-family:var(--disp);font-style:italic;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.lvl.l1{border-color:var(--blue);color:#6DB1FF}.lvl.l2{border-color:var(--acc);color:var(--acc)}.lvl.l3{background:var(--red);border-color:var(--red);color:#fff}

/* cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.bar{height:10px;background:var(--card2);overflow:hidden;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.bar>i{display:block;height:100%;background:var(--acc);transition:width .4s}
.hero{display:flex;align-items:center;gap:14px;margin-top:14px}
.hero .pct{font-family:var(--disp);font-style:italic;font-size:52px;font-weight:800;line-height:1;color:var(--acc)}

/* les 4 moments */
.cycle{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.mom{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 14px;min-height:118px;overflow:hidden}
.mom .n{font-family:var(--disp);font-style:italic;font-size:13px;color:var(--c);letter-spacing:.08em;text-transform:uppercase}
.mom b{display:block;font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase;font-size:24px;line-height:1.05;margin:4px 0 6px}
.mom .small{line-height:1.3}
.mom .bar{position:absolute;left:12px;right:12px;bottom:10px;height:6px;clip-path:none;border-radius:99px}
.mom .bar>i{background:var(--c);border-radius:99px}
.cycle .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;z-index:2}
.cycle .hub svg{width:26px;height:26px;color:var(--acc)}

/* listes */
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:60px;width:100%;text-align:left}
.row .dot{flex:none;width:10px;height:38px;background:var(--c,var(--acc));clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.row.cta{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.row.cta .tx b{font-size:18px}.row.cta .tx span{color:#3A3F2A}.row.cta .st{color:var(--acc-ink);font-family:var(--disp);font-style:italic;font-weight:800;font-size:26px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;line-height:1.25}
.row .tx span{display:block;color:var(--mut);font-size:14px;line-height:1.3}
.row .st{flex:none;font-size:14px;color:var(--mut);display:flex;align-items:center;gap:6px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent}
.chk.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.stars{letter-spacing:1px;color:#3A5588;font-size:15px;white-space:nowrap}
.stars b{color:var(--acc);font-weight:400}
details.card{padding:0}
details.card summary{padding:14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:52px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:22px;color:var(--mut)}
details[open].card summary::after{content:"–"}
details.card ul{margin:0;padding:0 14px 14px 32px}
li{margin-bottom:6px}

/* terrain */
.board{background:var(--turf);border-radius:16px;overflow:hidden;border:1px solid var(--line);display:flex;justify-content:center}
.board svg{display:block;width:100%;max-height:48vh;touch-action:manipulation}
.board.v-full svg{max-height:40vh}
.board.v-long svg{max-height:46vh}
.board.sit svg{max-height:38vh}
.board.drag svg{touch-action:none;cursor:grab}
.pl{fill:none;stroke:rgba(255,255,255,.6);stroke-width:.3}
.mate{fill:#2F8FFF;stroke:#0B1833;stroke-width:.25}
.opp{fill:#E8102A;stroke:#0B1833;stroke-width:.3}
.gk{fill:#FEE438;stroke:#0B1220;stroke-width:.45}
.ball{fill:#fff;stroke:#111;stroke-width:.3}
.elb{font:700 1px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.halo{fill:none;stroke:#FEE438;stroke-width:.4;opacity:.8;transform-box:fill-box;transform-origin:center;animation:halo 1.4s ease-out infinite}
@keyframes halo{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.pk{fill:none;stroke:#fff;stroke-width:.35;stroke-dasharray:.9 .7;opacity:.85}
.sel .pk{stroke:#FEE438;stroke-width:.8;stroke-dasharray:none;opacity:1}
.good .pk{stroke:#35C97A;stroke-width:.9;stroke-dasharray:none;opacity:1}
.tbar{height:10px;background:var(--card2);overflow:hidden;margin:10px 0 2px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--acc),#FF8A3D);transition:width 6s linear}
.words{display:grid;grid-template-columns:1fr 1fr;gap:8px}.words .opt{margin:0;text-align:center;font-family:var(--disp);font-style:italic;font-weight:800;font-size:27px;min-height:66px;text-transform:uppercase;letter-spacing:.02em}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 2px}
.seg .btn{padding:0;min-height:48px;font-size:20px}
.seg .btn.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.spot{cursor:pointer}.spot .bg{fill:rgba(11,18,32,.55)}
.wrong .pk{stroke:#FF5A4E;stroke-width:.9;stroke-dasharray:none;opacity:1}
.wall{fill:#2F8FFF;stroke:#0B1833;stroke-width:.25}
.ghost{fill:none;stroke:#fff;stroke-width:.3;stroke-dasharray:.6 .5}
.recap{margin:0;padding-left:20px}.recap li{margin-bottom:8px}
.fx{animation:fade .45s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.zlab{font:italic 700 2px var(--disp);fill:#fff;text-anchor:middle;text-transform:uppercase;letter-spacing:.05em}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut);margin:8px 2px 0}
.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border-radius:50%}

.cap{margin-top:0;min-height:8.4em}
.cap .n{font-family:var(--disp);font-style:italic;font-size:13px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.cap p{font-size:17px;line-height:1.4;margin:0}
.dots{display:flex;gap:5px}.dots i{width:20px;height:6px;background:var(--card2);clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}.dots i.on{background:var(--acc)}
.ctl{display:grid;grid-template-columns:56px 1fr 1fr;gap:8px;margin-top:10px}
.ctl.stick{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));z-index:3;background:var(--bg);padding:8px 0;margin:2px 0 0}
.btn{min-height:50px;border-radius:0;border:0;background:var(--card2);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);font-family:var(--disp);font-style:italic;text-transform:uppercase;letter-spacing:.04em;font-size:19px;font-weight:800;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--ink)}
.btn:disabled{opacity:.4}
.btn.full{width:100%;margin-top:10px}
.keys{margin-top:14px}.keys h3{font-size:15px;color:var(--mut);margin-bottom:8px;letter-spacing:.08em}
.keys ul{margin:0;padding-left:20px}

/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:56px;margin-top:8px;font-size:16px;line-height:1.35}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.fb{margin-top:12px;border-left:4px solid var(--acc);padding:4px 0 4px 12px}
.fb>b{font-family:var(--disp);font-style:italic;text-transform:uppercase;font-size:19px;display:block}
.big{font-family:var(--disp);font-style:italic;font-weight:800;font-size:64px;line-height:1;color:var(--acc)}
input[type=text]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 12px}


/* lot C */
.tick{flex:none;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
.lab{display:block;font-weight:600;margin:14px 0 4px}
textarea{display:block;width:100%;min-height:68px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg.c3 .btn{font-size:16px;padding:0 6px}

/* lot D */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{min-height:44px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:15px}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.lxh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lxw{font-family:var(--disp);font-style:italic;text-transform:uppercase;font-size:24px;line-height:1.1;color:var(--acc);min-width:0;overflow-wrap:anywhere}
.lxb{flex:none;min-height:44px;font-size:14px;padding:0 12px}
.guide{text-align:center;padding:22px 14px;border-left:5px solid var(--acc)}
.seg.c2{grid-template-columns:repeat(2,1fr)}.seg.c2 .btn{font-size:16px;padding:0 6px}

/* navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-family:var(--body);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.06em;color:var(--mut)}
nav a svg{width:24px;height:24px}
@media (max-width:420px){nav a{font-size:11px;letter-spacing:.01em}}
@media (max-width:360px){nav a{font-size:10.5px;letter-spacing:0;text-transform:none}nav a svg{width:22px;height:22px}}
nav a.on{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.halo,.fx{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cover{position:relative;margin:-14px -16px -44px}
.cover img{display:block;width:100%;height:auto;max-height:min(520px,72vh);aspect-ratio:900/1055;object-fit:cover;object-position:top;background:#0B1833}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to bottom,rgba(11,24,51,0),var(--bg))}
.cover~*{position:relative}
body.locked nav{display:none}
.lock input[type=password]{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:18px;padding:0 14px}
.lock .err{color:var(--bad);min-height:24px;margin:8px 0 0;font-weight:600}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* lot H : physique, nutrition */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chips .btn{min-height:44px;font-size:16px;padding:0 14px}
.chips .btn.on{background:var(--acc);color:var(--acc-ink)}
.chipd{display:inline-block;font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin:0 6px 6px 0}
.yt{display:inline-flex;align-items:center;min-height:44px;color:var(--cyan);font-weight:600}
ul.tl{margin:0;padding-left:20px}ul.tl li{margin:0 0 7px}ul.tl li:last-child{margin-bottom:0}
.card.alt{background:var(--card2)}
.kv{margin:0 0 10px}.kv b{display:block;font-family:var(--disp);font-style:italic;text-transform:uppercase;font-size:16px;letter-spacing:.03em;color:var(--acc)}
.num{width:100%;min-height:48px}
.cg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cg label{display:block;font-size:13px;color:var(--mut);margin:0 0 3px}
.res{margin-top:12px;border-left:4px solid var(--acc);padding:2px 0 2px 12px}
</style>
</head>
<body>
<main id="app"></main>
<nav><div>
  <a href="#" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V7h16v13"/><path d="M4 12h16M9 7v13M15 7v13"/></svg>Apprendre</a>
  <a href="#seance" data-t="seance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Séance</a>
  <a href="#defis" data-t="defis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Défis</a>
  <a href="#physique" data-t="physique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Physique</a>
  <a href="#nutrition" data-t="nutrition"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5C9.5 6 4.5 7.5 4.5 12.5c0 4 3 8 5 8 1.3 0 1.7-.7 2.5-.7s1.2.7 2.5.7c2 0 5-4 5-8 0-5-5-6.5-7.5-4z"/><path d="M12 8.5c0-2 1-4 3-5"/></svg>Nutrition</a>
  <a href="#progres" data-t="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Progrès</a>
</div></nav>

<script>
/* =====================================================================
   CONTENU — tout ce qui s'enseigne est ici. Pour ajouter une leçon,
   un défi ou une question, on ajoute un bloc dans ce fichier.
   Terrain : 68 x 105. Ton but est en bas (y = 105), centre x = 34.
   Identifiants : g = gardien, m = coéquipier, o = adversaire, b = ballon.
   ===================================================================== */
const LEVELS = {
  1: { n: 'Fondations', d: 'Les réflexes de base, à maîtriser maintenant.' },
  2: { n: 'Avancé', d: 'Lecture du jeu, terrain à 11, ligne défensive haute.' },
  3: { n: 'Élite', d: 'Lire le tireur, battre le pressing, deuxième action, leadership.' }
};

const MODULES = [
  { id: 'm1', n: 'En possession', k: 'On a le ballon', c: '#3FA7FF', moment: 1,
    intro: "Quand ton équipe a le ballon, tu n'es pas spectateur : tu es le joueur de plus, celui qui est toujours libre." },
  { id: 'm2', n: 'Perte du ballon', k: 'On vient de le perdre', c: '#FF9F2E', moment: 2,
    intro: "Les 5 secondes après la perte sont les plus dangereuses. Ta position de départ décide de tout." },
  { id: 'm3', n: 'Sans possession', k: 'Ils ont le ballon', c: '#FF5A4E', moment: 3,
    intro: "L'adversaire a le ballon. Tu ajustes ta position à chaque passe : angle, profondeur, appuis." },
  { id: 'm4', n: 'Récupération', k: 'On vient de le gagner', c: '#35C97A', moment: 4,
    intro: "Tu viens de récupérer le ballon. Accélérer ou calmer ? C'est toi qui choisis le rythme du match." },
  { id: 'm5', n: 'Un contre un', k: 'Face à l\'attaquant', c: '#B58CFF',
    intro: "Le duel. Il se gagne avec la tête avant de se gagner avec les mains : sortir, rester, quand s'arrêter." },
  { id: 'm6', n: 'Centres et ballons aériens', k: 'Dominer sa surface', c: '#4FD1D9',
    intro: "Un gardien qui sort bien sur les centres enlève dix occasions par match à l'adversaire." },
  { id: 'm7', n: 'Relance et jeu au pied', k: 'Courte, longue, à la main', c: '#F5D547',
    intro: "Tu es le premier attaquant. Chaque relance est une décision : où est l'espace, où est le joueur libre ?" },
  { id: 'm8', n: 'Coups de pied arrêtés', k: 'Corners, coups francs, penaltys', c: '#FF7EB6',
    intro: "Sur phase arrêtée, tu as le temps d'organiser. Profites-en : c'est toi le patron." },
  { id: 'm9', n: 'Communication et mental', k: 'La voix et la tête', c: '#9BE15D',
    intro: "Tu vois tout le terrain. Ta voix est ton deuxième outil, ton calme le troisième." },
  { id: 'm10', n: 'Technique de base', k: 'Appuis, prises, plongeons', c: '#C9CED8',
    intro: "Les gestes qui rendent tout le reste possible. À revoir souvent, même chez les pros." }
];

const SCENES = [
/* ---------- M1 : EN POSSESSION ---------- */
{ id: 's1', m: 'm1', lvl: 1, view: 'half', t: 'Tu es le joueur de plus',
  init: { g:[34,100], b:[34,98.6], m1:[20,96], m2:[48,96], m3:[5,84], m4:[63,84], m5:[34,80], o1:[27,84], o2:[41,84], o3:[34,72] },
  lb: { m1:'DC', m2:'DC', m5:'6' },
  steps: [
    { t: "Sortie de but. Devant ta surface : 2 attaquants contre tes 2 centraux… plus toi. Avec le gardien, ton équipe est toujours en supériorité.", z:[12,90,44,12,'3 contre 2'] },
    { t: "Tu joues court sur ton central gauche. Un attaquant sort le presser.", mv:{ b:[20.6,95.4], o1:[23,91] } },
    { t: "Ne reste pas planté ! Décale-toi pour offrir une passe en retrait, en diagonale derrière le ballon.", mv:{ g:[28,99.5] } },
    { t: "Retrait. Le 2e attaquant sort sur toi : ça veut dire qu'un coéquipier est libre de l'autre côté. Tu l'avais vu AVANT de recevoir.", mv:{ b:[28.4,98.8], o2:[32,92.5] } },
    { t: "Contrôle orienté, passe au central droit. Deux touches, pressing battu : il peut avancer balle au pied.", mv:{ b:[48,95.3] } }
  ],
  keys: ["Avant de recevoir, regarde par-dessus tes épaules : qui est libre ?", "Première touche qui t'ouvre vers le côté opposé au pressing.", "Passe devant ton but seulement si la ligne est 100 % libre."] },

{ id: 's2', m: 'm1', lvl: 1, view: 'full', t: 'Ta hauteur quand ton équipe attaque',
  init: { g:[34,97], b:[34,75], m1:[24,80], m2:[44,80], m3:[34,68], o1:[35,62] },
  lb: { m1:'DC', m2:'DC' },
  steps: [
    { t: "Ballon dans ton tiers : tu es disponible derrière tes centraux, à quelques mètres de ta ligne." },
    { t: "Ballon au milieu : ta défense monte, tu montes avec elle, jusqu'à la limite de ta surface.", mv:{ b:[40,50], m1:[24,62], m2:[44,62], m3:[34,48], o1:[35,58], g:[34,88] } },
    { t: "Ballon dans le tiers adverse : tes centraux sont à la médiane. Tu sors de ta surface pour protéger l'espace dans leur dos. C'est le rôle de gardien-libéro.", mv:{ b:[45,22], m1:[24,49], m2:[44,49], m3:[36,32], o1:[35,47], g:[34,80] }, z:[10,52,48,26,'Espace à protéger'] },
    { t: "Repère : garde à peu près la même distance entre toi et ton dernier défenseur. S'il monte de 10 m, tu montes de 10 m. Adapte les distances à la grandeur du terrain." }

  keys: ["Tu bouges avec ta défense, comme si un élastique vous reliait.", "Trop bas = tu laisses un immense espace aux longs ballons.", "Trop haut = tu te fais lober. Si tu ne peux pas revenir sur un tir de loin, recule."] },

/* ---------- M2 : PERTE DU BALLON ---------- */

/* ---------- M3 : SANS POSSESSION ---------- */
{ id: 's6', m: 'm3', lvl: 1, view: 'third', t: 'La ligne ballon–centre du but',

    { t: "À droite, même chose. Remarque : plus le ballon est sur le côté, plus tu te rapproches de ton premier poteau.", mv:{ b:[52,88], o1:[53,86.6], g:[36.5,102.6] }, cone:1 },

{ id: 's7', m: 'm3', lvl: 1, view: 'half', t: 'Ta profondeur selon la distance du ballon',

    { t: "Zone de tir : 2 à 3 m devant ta ligne, arrêté, mains prêtes. Ici la priorité n'est plus la profondeur, c'est le tir.", mv:{ b:[38,84.5], o1:[38,83], m1:[27,90], m2:[41,89], o2:[33,92], g:[34.4,102.3] }, cone:1 },
    { t: "Règle simple : ballon loin = je suis haut, je protège l'espace. Ballon proche = je suis près de mon but, je protège le tir." }
  ],
  keys: ["Ta profondeur change à chaque passe adverse.", "Vérifie souvent où sont tes poteaux (un coup d'œil, une main).", "Entre deux positions, choisis celle où tu peux être arrêté à temps."] },

{ id: 's8', m: 'm3', lvl: 1, view: 'third', t: 'Ballon sur le côté : premier poteau',

  ],
  keys: ["Rien ne passe entre toi et ton premier poteau.", "Corps ouvert : tu vois le ballon ET le point de penalty.", "Après un centre en retrait : replace-toi, puis arrête-toi. Dans cet ordre."] },

{ id: 's9', m: 'm3', lvl: 1, view: 'third', t: 'Sois arrêté avant le tir',

    { t: "Tu es stable, donc tu peux pousser fort dans n'importe quelle direction. Un gardien encore en mouvement est battu par un tir moyen.", mv:{ b:[37.4,104], g:[36.7,103.4] }, shot:1 }

/* ---------- M4 : RÉCUPÉRATION ---------- */

/* ---------- M5 : UN CONTRE UN ---------- */
{ id: 's12', m: 'm5', lvl: 1, view: 'half', t: 'Sortir ou rester ?',

  keys: ["Signal pour sortir : touche longue, contrôle raté, tête baissée.", "Signal pour rester : ballon collé, tête levée.", "Hésiter au milieu est la pire option."] },

{ id: 's13', m: 'm5', lvl: 1, view: 'third', t: 'Avancer, s\'arrêter, rester grand',

    { t: "Tu y vas : « J'AI ! » Dans ta surface, tu captes en plongeant vers le ballon. Hors de ta surface, c'est au pied, fort et vers le côté.", mv:{ g:[39.6,91.4], o2:[40,85], m1:[37,82] } },

  keys: ["Décide dans la première seconde, puis ne change plus d'idée.", "Annonce toujours : ton défenseur doit savoir.", "Si tu restes, recule sur ta ligne ballon–but et arrête-toi."] },

  keys: ["Angle fermé = reste debout et patient.", "Premier poteau d'abord, le reste ensuite.", "Garde un œil sur l'attaquant au centre : la passe en retrait arrive vite."] },

/* ---------- M6 : CENTRES ---------- */

    { t: "Ballon dans ta zone : crie « J'AI ! » fort et tôt. Capte si tu es sûr. S'il y a du monde, boxe à deux poings, loin et vers le côté.", mv:{ b:[32,99.2], g:[32.4,99.9] } },

    else if (t === 'm') h = (opt.pick ? `<circle r="${4.2 * k}" fill="transparent"/><circle r="${2.4 * k}" class="pk"/>` : '') + `<circle r="${1.5 * k}" class="mate"/>` + (lb ? `<text class="elb" style="font-size:${1.35 * k}px" fill="#fff">${lb}</text>` : '');

    else h = `<circle r="${.85 * k}" class="ball"/>`;

    <div class="ctl" style="grid-template-columns:1fr 1fr"><button class="btn" id="re">↺ Réessayer</button>${nx ? `<a class="btn pri" href="#p/${nx.id}">Suivant →</a>` : `<a class="btn pri" href="#defis">Terminer ✓</a>`}</div>`;
    $('#re').onclick = () => vPlace(id);
  };
}

function vSit(id) {
  const x = SITS.find(s => s.id === id); if (!x) return vHome();
  if (x.k === 'raf') return vRafale(x); if (x.k === 'mur') return vMur(x); if (x.k === 'cor') return vCorner(x);
  const K = KINDS[x.k], pre = x.pre || [], aft = x.after || [], all = pre.concat(aft), txt = x.k === 'lis' || x.k === 'err', timed = !!K.slow;
  const q = x.k === 'sor' ? 'Tu sors ou tu restes ?' : x.q;
  app.innerHTML = hdr('defis', K.n, x.t, lvl(x.lvl)) + `
  <div class="card" style="margin-bottom:8px;min-height:5.2em"><p style="margin:0;font-size:17px;line-height:1.35" id="ctx">${x.ctx}</p></div>
  <div id="bd"></div><div id="qa" style="margin-top:10px"></div>`;
  let who = null, done = false, t0 = 0;
  board = new Board($('#bd'), { view: x.view, init: x.init, lb: x.lb, steps: pre.concat(aft) }, { pick: x.k === 'qui' ? pid => { if (done || !t0) return; who = pid; board.mark(pid); words(); } : null });
  $('#bd').classList.add('sit');
  const run = (a, b, cb) => { if (a >= b) return cb && later(cb, 300); if (all[a].t) $('#ctx').textContent = all[a].t; board.go(a, true); later(() => run(a + 1, b, cb), noMotion ? 500 : all[a].t ? 1700 : 1250); };
  const stop = () => `<span class="lvl" style="border-color:var(--bad);color:var(--bad);margin-right:8px;vertical-align:2px">Stop</span><b>${q.replace(/ ([?!:;])/g, '\u00A0$1')}</b>`;
  const words = () => {
    if ($('#os')) return;
    const opts = x.k === 'sor' ? [{ t: "J'y vais !", ok: x.a === 'go' }, { t: 'Je reste !', ok: x.a === 'stay' }] : shuffle(x.o.map((t, j) => ({ t, ok: j === 0 })));
    $('#qa').insertAdjacentHTML('beforeend', `<div id="os" class="${txt ? '' : 'words'}">${opts.map(o => `<button class="opt">${o.t}</button>`).join('')}</div>` + (timed ? `<div class="tbar"><i style="transition-duration:${K.slow}s"></i></div>` : ''));
    if (timed) { t0 = performance.now(); requestAnimationFrame(() => requestAnimationFrame(() => { const b = $('.tbar i'); if (b) b.style.width = '0%'; })); }
    [...$('#os').children].forEach((b, j) => b.onclick = () => answer(opts, j));
    if (x.k === 'qui') $('#os').scrollIntoView({ block: 'nearest' });
  };
  const ask = () => {
    $('#ctx').innerHTML = stop();
    $('#qa').innerHTML = (x.k === 'qui' ? '<p class="mut small" id="hint">Touche d\'abord le coéquipier à qui tu parles (cercles pointillés).</p>' : '');
    t0 = 1; if (x.k !== 'qui') words();
    if (x.k === 'err') {
      $('#qa').insertAdjacentHTML('beforeend', '<button class="btn full" id="rp">↺ Revoir l\'action</button>');
      $('#rp').onclick = () => { if (done) return; $('#rp').disabled = true; tms.forEach(clearTimeout); tms = []; board.reset(); $('#ctx').textContent = x.ctx;
        later(() => run(0, pre.length, () => { if (done) return; $('#ctx').innerHTML = stop(); $('#rp').disabled = false; }), 500); };
    }
  };
  const answer = (opts, j) => {
    if (done) return; done = true;
    const sec = (performance.now() - t0) / 1000, okW = opts[j].ok, okP = x.k !== 'qui' || who === x.who;
    [...$('#os').children].forEach((b, n) => { if (opts[n].ok) b.classList.add('ok'); else if (n === j) b.classList.add('bad'); b.disabled = true; });
    const tb = $('.tbar'); if (tb) tb.remove();
    const rp = $('#rp'); if (rp) rp.remove();
    tms.forEach(clearTimeout); tms = [];
    let st, msg;
    if (timed) { st = !okW ? 0 : sec <= K.fast ? 3 : sec <= K.slow ? 2 : 1; msg = (x.k === 'sor' ? ['Mauvaise décision', 'Bonne décision, mais trop tard', 'Bonne décision, un peu lente', 'Parfait !'] : ['Pas le bon mot', 'Bon mot, mais trop tard', 'Bon mot, un peu lent', 'Parfait !'])[st]; }
    else if (x.k === 'qui') { st = okW && okP ? 3 : okW || okP ? 1 : 0; msg = st === 3 ? 'Parfait !' : okW ? 'Bon mot, mauvais joueur' : okP ? 'Bon joueur, mauvais mot' : 'Pas cette fois'; board.mark(x.who, 'good'); }
    else { st = okW ? 3 : 0; msg = okW ? (x.k === 'err' ? 'Bien vu !' : 'Bien lu !') : 'Pas cette fois'; }
    run(pre.length, all.length);
    sitEnd(x, st, msg, (timed && okW ? `Ta réponse : ${sec.toFixed(1).replace('.', ',')} s. ` : '') + x.w);
  };
  later(() => run(0, pre.length, ask), 900);
}

/* fin commune des situations : étoiles, explication, rejouer / suivant */
function sitEnd(x, st, msg, body) {
  const same = SITS.filter(s => s.k === x.k), nx = same[same.indexOf(x) + 1];
  if (st > (S.si[x.id] || 0)) { S.si[x.id] = st; save(); }
  $('#qa').insertAdjacentHTML('beforeend', `<div class="fb" style="border-color:var(--${st >= 2 ? 'ok' : st ? 'acc' : 'bad'})"><b>${msg} ${stars(st)}</b>${body.startsWith('<') ? body : `<p>${body}</p>`}</div>
  <div class="ctl" style="grid-template-columns:1fr 1fr"><button class="btn" id="re">↺ Rejouer</button>${nx ? `<a class="btn pri" href="#x/${nx.id}">Suivant →</a>` : `<a class="btn pri" href="#defis">Terminer ✓</a>`}</div>`);
  $('#re').onclick = () => { stopAll(); vSit(x.id); window.scrollTo(0, 0); };
}
const sitTop = x => hdr('defis', KINDS[x.k].n, x.t, lvl(x.lvl)) + `<div class="card" style="margin-bottom:8px"><p style="margin:0;font-size:17px;line-height:1.35" id="ctx">${x.ctx}</p></div><div id="bd"></div><div id="qa" style="margin-top:10px"></div>`;

/* ---------- courte ou longue, en rafale ---------- */
function vRafale(x) {
  const T = KINDS.raf.slow, N = x.items.length;
  app.innerHTML = sitTop(x);
  const mk = (init, steps) => { if (board) board.stop(); board = new Board($('#bd'), { view: x.view, init: Object.assign({}, x.base, init), lb: x.lb, steps }); };
  mk(x.base ? {} : { g:[34,99.5], b:[34,98.2] }, []);
  $('#qa').innerHTML = `<p class="mut small">${N} situations. Tu as ${T} secondes pour chacune : regarde qui est marqué, qui est libre, puis touche « Courte » ou « Longue ».</p><button class="btn pri full" id="go">▶ Départ</button>`;
  let its, i, score, tsum, miss, open = false, to = 0, t0 = 0;
  const show = () => {
    const it = its[i]; mk(it.init, [{ mv: { b: it.to } }]);
    $('#ctx').innerHTML = `<span class="lvl" style="margin-right:8px;vertical-align:2px">${i + 1} / ${N}</span><b>${it.s}</b>`;
    [...$('#os').children].forEach(b => { b.className = 'opt'; b.disabled = false; });
    $('#rf').innerHTML = '';
    const bar = $('.tbar i'); bar.style.transition = 'none'; bar.style.width = '100%'; void bar.offsetWidth; bar.style.transition = `width ${T}s linear`; bar.style.width = '0%';
    open = true; t0 = performance.now(); to = setTimeout(() => ans(null), T * 1000); tms.push(to);
  };
  const ans = a => {
    if (!open) return; open = false; clearTimeout(to);
    const it = its[i], sec = (performance.now() - t0) / 1000, ok = a === it.a, bar = $('.tbar i');
    const w = getComputedStyle(bar).width; bar.style.transition = 'none'; bar.style.width = w;
    [...$('#os').children].forEach(b => { if (b.dataset.a === it.a) b.classList.add('ok'); else if (b.dataset.a === a) b.classList.add('bad'); b.disabled = true; });
    if (ok) { score++; tsum += sec; } else miss.push(it);
    board.go(0, true);
    $('#rf').innerHTML = `<b style="color:var(--${ok ? 'ok' : 'bad'})">${ok ? 'Oui !' : a ? 'Non.' : 'Trop tard.'}</b> ${it.w}`;
    later(() => { i++; i < N ? show() : end(); }, ok ? 1600 : 3400);
  };
  const start = () => {
    its = shuffle(x.items); i = 0; score = 0; tsum = 0; miss = [];
    $('#qa').innerHTML = `<div class="tbar" style="margin-top:0"><i></i></div><div id="os" class="words"><button class="opt" data-a="c">Courte</button><button class="opt" data-a="l">Longue</button></div><p id="rf" style="min-height:4.4em;margin:10px 2px 0;line-height:1.4" aria-live="polite"></p>`;
    [...$('#os').children].forEach(b => b.onclick = () => ans(b.dataset.a));
    show();
  };
  const end = () => {
    const st = score >= N - 1 ? 3 : score >= N - 3 ? 2 : score >= N - 5 ? 1 : 0;
    if (board) board.stop(); board = null; $('#bd').remove();
    $('#ctx').parentNode.outerHTML = `<div class="card" style="text-align:center;padding:24px 14px"><div class="big">${score}/${N}</div><p style="margin:10px 0 0">${score ? `Temps moyen sur tes bonnes réponses : ${(tsum / score).toFixed(1).replace('.', ',')} s.` : 'Revois la leçon « Courte ou longue ? Compte les joueurs ».'}</p></div>`;
    $('#qa').innerHTML = '';
    sitEnd(x, st, ['On recommence', 'Pas encore', 'Solide !', 'Parfait !'][st], miss.length ? `<p>À revoir :</p><ul class="recap">${miss.map(m => `<li><b>${m.s}</b> ${m.a === 'c' ? 'Courte' : 'Longue'}. ${m.w}</li>`).join('')}</ul>` : `<p>${st === 3 && score === N ? 'Sans faute. ' : ''}Tu comptes vite et tu choisis bien : c'est ça, être le premier attaquant.</p>`);
    window.scrollTo(0, 0);
  };
  $('#go').onclick = start;
}

/* ---------- place ton mur ---------- */
function vMur(x) {
  const R = 9.15, SP = 1.2, B = x.init.b, P = [x.post === 'g' ? 30.34 : 37.66, 105];
  const aP = Math.atan2(P[1] - B[1], P[0] - B[0]), aC = Math.atan2(105 - B[1], 34 - B[0]), side = Math.sign(aP - aC) || 1;
  const outer = (th, n) => side * (th + side * (n - 1) / 2 * SP / R - aP) * R;   // mètres dont le joueur du bout dépasse la ligne ballon–poteau
  const ideal = n => aP + side * (0.6 - (n - 1) / 2 * SP) / R;
  let n = 3, th = aC - side * 0.3, done = false;
  app.innerHTML = sitTop(x);
  board = new Board($('#bd'), { view: x.view, init: x.init, steps: [] });
  $('#bd').classList.add('sit', 'drag'); board.fx({ cone: 1 });
  const row = (t, m) => { const c = [B[0] + R * Math.cos(t), B[1] + R * Math.sin(t)], tg = [-Math.sin(t), Math.cos(t)]; return { c, tg, pts: Array.from({ length: m }, (_, i) => { const o = (i - (m - 1) / 2) * SP; return [c[0] + tg[0] * o, c[1] + tg[1] * o]; }) }; };
  const arc = `<circle cx="${B[0]}" cy="${B[1]}" r="${R}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width=".22" stroke-dasharray=".8 .8"/>`;
  const draw = (extra = '') => { board.over.innerHTML = arc + extra + row(th, n).pts.map(p => `<circle cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="1.1" class="wall"/>`).join(''); };
  $('#qa').innerHTML = `<div id="tools"><p class="mut small" style="margin:0">Combien de joueurs dans ton mur ?</p>
    <div class="seg" id="seg">${[1,2,3,4,5].map(v => `<button class="btn" data-n="${v}" aria-label="${v} joueur${v > 1 ? 's' : ''}">${v}</button>`).join('')}</div>
    <div class="ctl" style="grid-template-columns:56px 1fr 56px;align-items:center"><button class="btn" id="lf" aria-label="Décaler le mur à gauche">◀</button><span class="mut small" style="text-align:center;line-height:1.3">Glisse ton doigt sur le terrain pour déplacer le mur</span><button class="btn" id="rt" aria-label="Décaler le mur à droite">▶</button></div>
    <button class="btn pri full" id="ok">Valider mon mur</button></div>`;
  const clamp = t => Math.max(aC - .55, Math.min(aC + .55, t));
  const seg = () => [...$('#seg').children].forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  [...$('#seg').children].forEach(b => b.onclick = () => { n = +b.dataset.n; seg(); draw(); });
  $('#lf').onclick = () => { th = clamp(th + .3 / R); draw(); };
  $('#rt').onclick = () => { th = clamp(th - .3 / R); draw(); };
  let dn = null;
  const svg = board.svg;
  svg.addEventListener('pointerdown', e => { if (done) return; dn = { q: board.pt(e), th }; try { svg.setPointerCapture(e.pointerId); } catch (z) {} e.preventDefault(); });
  svg.addEventListener('pointermove', e => { if (!dn || done) return; const q = board.pt(e), tg = [-Math.sin(dn.th), Math.cos(dn.th)]; th = clamp(dn.th + ((q[0] - dn.q[0]) * tg[0] + (q[1] - dn.q[1]) * tg[1]) / R); draw(); });
  ['pointerup', 'pointercancel'].forEach(k => svg.addEventListener(k, () => dn = null));
  seg(); draw();
  $('#ok').onclick = () => {
    done = true; $('#bd').classList.remove('drag');
    const o = outer(th, n), okN = x.n.includes(n), near = Math.min(...x.n.map(v => Math.abs(v - n))) === 1;
    const okP = o >= 0 && o <= 2.1, nearP = o >= -.8 && o <= 3.3;
    const st = okN && okP ? 3 : (okN && nearP) || (near && okP) ? 2 : 1;
    const nI = okN ? n : x.n[0], tI = ideal(nI), w = row(tI, nI), h = nI / 2 * SP;
    const ends = [-h, h].map(s => [w.c[0] + w.tg[0] * s, w.c[1] + w.tg[1] * s]), prj = ends.map(e => [B[0] + (e[0] - B[0]) * (105 - B[1]) / (e[1] - B[1]), 105]);
    const g = x.init.g;
    draw(`<polygon points="${ends[0]} ${ends[1]} ${prj[1]} ${prj[0]}" fill="rgba(53,201,122,.38)" stroke="#35C97A" stroke-width=".25"/>` + (st === 3 ? '' : w.pts.map(p => `<circle cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="1.2" class="ghost"/>`).join('')) + `<circle cx="${g[0]}" cy="${g[1]}" r="2.3" fill="rgba(254,228,56,.16)" stroke="#FEE438" stroke-width=".3" stroke-dasharray="1 .8"/>`);
    $('#tools').remove();
    const mN = okN ? `${n} joueur${n > 1 ? 's' : ''} : bon choix.` : `Tu as mis ${n} joueur${n > 1 ? 's' : ''} ; ici, il en faut ${x.n.join(' ou ')}.`;
    const mP = okP ? 'Ton premier poteau est bien couvert.' : o < 0 ? 'Ton mur laisse le premier poteau ouvert : décale-le vers l\'extérieur.' : 'Ton mur est trop décalé vers l\'extérieur : le joueur du bout dépasse seulement un peu la ligne ballon–poteau.';
    sitEnd(x, st, ['', 'Pas encore', 'Presque !', 'Parfait !'][st], `<p>${mN} ${mP}</p><p>${st === 3 ? '' : 'Les cercles blancs montrent le bon mur. '}La zone verte est ce que le mur protège ; le cercle jaune, c'est ta place. ${x.w}</p>`);
  };
}

/* ---------- organise ton corner ---------- */
function vCorner(x) {
  const need = x.need, sp = shuffle(x.spots), L = 'ABCDEFGH', sel = new Set();
  app.innerHTML = sitTop(x);
  board = new Board($('#bd'), { view: x.view, init: x.init, lb: x.lb, steps: [] });
  $('#bd').classList.add('sit');
  const k = board.k;
  board.over.innerHTML = sp.map((s, j) => `<g class="spot" data-j="${j}" transform="translate(${s.p[0]} ${s.p[1]})" role="button" aria-label="Endroit ${L[j]}"><circle r="${4.3 * k}" fill="transparent"/><circle r="${2.6 * k}" class="bg"/><circle r="${2.6 * k}" class="pk"/><text class="elb" style="font-size:${2.1 * k}px" fill="#fff">${L[j]}</text></g>`).join('');
  $('#qa').innerHTML = `<div id="tools"><p class="mut small" style="margin:0">Touche les ${need} endroits où tu envoies tes joueurs libres. Choisis : <b id="cnt">0</b> / ${need}</p><button class="btn pri full" id="ok" disabled>Valider mon organisation</button></div>`;
  const nodes = [...board.over.children];
  nodes.forEach((g, j) => g.addEventListener('click', () => {
    if (!$('#ok')) return;
    if (sel.has(j)) sel.delete(j); else if (sel.size < need) sel.add(j); else return;
    g.classList.toggle('sel', sel.has(j)); $('#cnt').textContent = sel.size; $('#ok').disabled = sel.size !== need;
  }));
  $('#ok').onclick = () => {
    const good = sp.map((s, j) => j).filter(j => sp[j].ok), hit = good.filter(j => sel.has(j)).length;
    nodes.forEach((g, j) => { g.classList.remove('sel'); if (sp[j].ok) g.classList.add('good'); else if (sel.has(j)) g.classList.add('wrong'); else g.style.opacity = .35; });
    const to = {}; x.free.forEach((id, n) => { if (good[n] != null) to[id] = sp[good[n]].p; }); board.move(to, 1100);
    later(() => good.forEach(j => nodes[j].style.display = 'none'), noMotion ? 0 : 1150);
    $('#tools').remove();
    const lines = sp.map((s, j) => ({ s, j })).filter(o => o.s.ok || sel.has(o.j)).map(o => `<li><b>${L[o.j]} · ${o.s.n}</b> ${o.s.ok ? (sel.has(o.j) ? '✓' : '(oublié)') : '✗'} ${o.s.w}</li>`).join('');
    sitEnd(x, hit === need ? 3 : hit, ['Pas encore', 'Un bon choix sur ' + need, 'Presque !', 'Parfait !'][hit === need ? 3 : hit], `<ul class="recap" style="margin-top:6px">${lines}</ul><p>${x.w}</p>`);
  };
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function vQuiz(id) {
  const all = id === 'all', m = MOD(id);

  if (!qs.length) return vHome();

  const backTo = all ? 'defis' : 'm/' + id;
  const ask = () => {
    const q = qs[i], opts = shuffle(q.o.map((t, j) => ({ t, ok: j === 0 })));
    app.innerHTML = hdr(backTo, all ? 'Quiz éclair' : 'Quiz · ' + m.n, `Question ${i + 1} / ${qs.length}`) + `
    <div class="bar" style="margin-bottom:14px"><i style="width:${100 * i / qs.length}%"></i></div>
    <p style="font-size:19px;line-height:1.35;font-weight:600">${q.q}</p>
    <div id="os">${opts.map((o, j) => `<button class="opt" data-j="${j}">${o.t}</button>`).join('')}</div><div id="res"></div>`;
    [...$('#os').children].forEach((b, j) => b.onclick = () => {
      if ($('#res').innerHTML) return;
      const good = opts[j].ok; if (good) score++;
      [...$('#os').children].forEach((x, k) => { if (opts[k].ok) x.classList.add('ok'); else if (k === j) x.classList.add('bad'); x.disabled = true; });
      $('#res').innerHTML = `<div class="fb" style="border-color:var(--${good ? 'ok' : 'bad'})"><b>${good ? 'Bien joué !' : 'Pas tout à fait'}</b><p>${q.w}</p></div><button class="btn pri full" id="nq">${i === qs.length - 1 ? 'Voir mon résultat' : 'Question suivante →'}</button>`;
      $('#nq').onclick = () => { i++; i < qs.length ? ask() : end(); window.scrollTo(0, 0); };
      $('#nq').scrollIntoView({ block: 'nearest', behavior: noMotion ? 'auto' : 'smooth' });

  };

    <div class="card" style="text-align:center;padding:28px 14px"><div class="big">${score}/${qs.length}</div><p style="margin-top:10px">${pct === 100 ? 'Sans faute. Mur infranchissable !' : pct >= 70 ? 'Solide. Revois les leçons des questions ratées.' : 'Revois les leçons animées, puis réessaie : tu vas l\'avoir.'}</p></div>

    $('#re').onclick = () => vQuiz(id);
  };
  ask();
}

  <div class="list">${MODULES.filter(m => QUIZ.some(q => q.m === m.id)).map(m => `<a class="row" style="--c:${m.c}" href="#q/${m.id}"><span class="dot"></span><span class="tx"><b>${m.n}</b><span>${QUIZ.filter(q => q.m === m.id).length} questions</span></span><span class="st">${S.qz[m.id] != null ? S.qz[m.id] + ' %' : 'À faire'}</span></a>`).join('')}</div>`;

}

function vProg() {

/* =====================================================================
   LOT C — séance du jour, révision espacée, programme jeu au pied, carnet
   ===================================================================== */
const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const dnum = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
const keyOf = n => new Date(n * 864e5).toISOString().slice(0, 10);
const frDate = k => { const [y, m, d] = k.split('-'); return `${+d} ${MOIS[+m - 1]} ${y}`; };
const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const plural = (n, a, b) => n > 1 ? b : a;

/* ---------- révision espacée (boîtes de Leitner) ---------- */
const RV_INT = [0, 1, 3, 7, 14, 30];
const qid = q => { let h = 0; for (const c of q.q) h = (h * 31 + c.charCodeAt(0)) | 0; return 'r' + (h >>> 0).toString(36); };
function revQueue() {
  const t = dnum(), due = [], fresh = [];
  QUIZ.forEach(q => { const c = S.rv[qid(q)]; if (!c) fresh.push(q); else if (c.d <= t) due.push(q); });
  return { due, fresh, t };
}
function revNext() {
  const t = dnum(); let m = Infinity;
  QUIZ.forEach(q => { const c = S.rv[qid(q)]; if (c && c.d > t) m = Math.min(m, c.d - t); });
  return m;
}
const revMastered = () => QUIZ.filter(q => (S.rv[qid(q)] || { b: 0 }).b >= 4).length;

function vRevision() {
  const { due, fresh, t } = revQueue();
  let qs = due.slice().sort((a, b) => S.rv[qid(a)].b - S.rv[qid(b)].b).slice(0, 10).map(q => ({ q, nw: false }));
  if (qs.length < 6) qs = qs.concat(shuffle(fresh).slice(0, Math.min(5, 6 - qs.length)).map(q => ({ q, nw: true })));
  const head = (title, sub) => hdr('seance', sub || 'Révision espacée', title);
  if (!qs.length) {
    const nx = revNext();
    app.innerHTML = head('Tout est à jour') + `<div class="card" style="text-align:center;padding:24px 14px"><div class="big">✓</div><p style="margin:10px 0 0">${nx === Infinity ? 'Tu as vu toutes les questions.' : `Prochaine révision dans ${nx} jour${plural(nx, '', 's')}.`}</p></div>
    <a class="btn pri full" href="#seance">Retour à ma séance</a>`;
    return;
  }
  let i = 0, score = 0;
  const first = qs.length;
  const ask = () => {
    const it = qs[i], q = it.q, opts = shuffle(q.o.map((x, j) => ({ t: x, ok: j === 0 })));
    app.innerHTML = head(`Question ${Math.min(i + 1, qs.length)} / ${qs.length}`) + `
    <div class="bar" style="margin-bottom:14px"><i style="width:${100 * i / qs.length}%"></i></div>
    <p class="mut small" style="margin-bottom:6px">${it.retry ? 'Encore une fois, pour bien retenir' : it.nw ? 'Nouvelle question' : 'À revoir'} · ${MOD(q.m).n}</p>
    <p style="font-size:19px;line-height:1.35;font-weight:600">${q.q}</p>
    <div id="os">${opts.map((o, j) => `<button class="opt" data-j="${j}">${o.t}</button>`).join('')}</div><div id="res"></div>`;
    [...$('#os').children].forEach((b, j) => b.onclick = () => {
      if ($('#res').innerHTML) return;
      const good = opts[j].ok;
      [...$('#os').children].forEach((x, k) => { if (opts[k].ok) x.classList.add('ok'); else if (k === j) x.classList.add('bad'); x.disabled = true; });
      if (!it.retry) {
        const id = qid(q), c = S.rv[id] || { b: 0, d: t };
        if (good) { score++; c.b = Math.min(5, c.b + 1); c.d = t + RV_INT[c.b]; } else { c.b = 1; c.d = t + 1; qs.push({ q, nw: false, retry: true }); }
        S.rv[id] = c; save();
      }
      const last = i === qs.length - 1;
      $('#res').innerHTML = `<div class="fb" style="border-color:var(--${good ? 'ok' : 'bad'})"><b>${good ? 'Bien joué !' : 'Pas tout à fait'}</b><p>${q.w}</p>${good ? '' : `<p class="small"><a href="#m/${q.m}" style="text-decoration:underline">Revoir le thème : ${MOD(q.m).n}</a></p>`}</div><button class="btn pri full" id="nq">${last ? 'Voir mon résultat' : 'Question suivante →'}</button>`;
      $('#nq').onclick = () => { i++; i < qs.length ? ask() : end(); window.scrollTo(0, 0); };
      $('#nq').scrollIntoView({ block: 'nearest', behavior: noMotion ? 'auto' : 'smooth' });
    });
  };
  const end = () => {
    const nx = revNext(), rest = revQueue();
    app.innerHTML = head('Résultat') + `
    <div class="card" style="text-align:center;padding:28px 14px"><div class="big">${score}/${first}</div><p style="margin-top:10px">${score === first ? 'Sans faute. Ces questions reviendront de plus en plus tard.' : 'Les questions ratées reviennent demain.'}</p><p class="mut small" style="margin:0">${rest.due.length ? `Encore ${rest.due.length} à revoir aujourd'hui.` : nx === Infinity ? '' : `Prochaine révision dans ${nx} jour${plural(nx, '', 's')}.`}</p></div>
    <div class="ctl" style="grid-template-columns:1fr 1fr">${rest.due.length || rest.fresh.length ? '<button class="btn" id="re">Continuer</button>' : '<span></span>'}<a class="btn pri" href="#seance">Ma séance →</a></div>`;
    const re = $('#re'); if (re) re.onclick = () => { vRevision(); window.scrollTo(0, 0); };
  };
  ask();
}

/* ---------- séance du jour ---------- */
const sdDone = k => ((S.sd[k] && S.sd[k].done) || []).length >= 3;
function streak() { let n = dnum(), c = 0; if (!sdDone(keyOf(n))) n--; while (sdDone(keyOf(n))) { c++; n--; } return c; }
function makePlan(seed) {
  const r = rng(seed), pick = a => a[Math.floor(r() * a.length)];
  const ranked = MODULES.map(m => ({ id: m.id, s: modStats(m.id).pct + r() * 30 })).sort((a, b) => a.s - b.s).map(o => o.id);
  const foc = ranked[0], inFoc = SCENES.filter(x => x.m === foc);
  const unseen = inFoc.find(x => !S.seen[x.id]) || ranked.map(id => SCENES.find(x => x.m === id && !S.seen[x.id])).find(Boolean);
  const sc = (unseen || pick(inFoc.length ? inFoc : SCENES)).id;
  const stOf = t => (t.t === 'x' ? S.si[t.id] : S.pl[t.id]) || 0;
  const all = SITS.map(x => ({ t: 'x', id: x.id, m: x.m, l: x.lvl })).concat(PLACES.map(x => ({ t: 'p', id: x.id, m: x.m, l: x.lvl })));
  let pool = all.filter(t => t.m === foc && stOf(t) < 3);
  if (!pool.length) pool = all.filter(t => stOf(t) < 3);
  if (!pool.length) pool = all;
  const lo = Math.min(...pool.map(t => t.l)); pool = pool.filter(t => t.l === lo);
  const tk = pick(pool), dr = DRILLS[foc] || DRILLS.m1;
  return { foc, sc, tk: { t: tk.t, id: tk.id }, dr: Math.floor(r() * dr.length) };
}
const planOk = p => p && SCENES.some(x => x.id === p.sc) && DRILLS[p.foc] && DRILLS[p.foc][p.dr] != null && (p.tk.t === 'x' ? SITS : PLACES).some(x => x.id === p.tk.id);
function todayPlan() {
  const k = keyOf(dnum()), day = S.sd[k] || (S.sd[k] = { r: 0, done: [], plan: null });
  if (!planOk(day.plan)) { day.plan = makePlan(dnum() * 31 + day.r); day.done = []; save(); }
  return day;
}

function vSeance() {
  const day = todayPlan(), P = day.plan, k = keyOf(dnum()), rq = revQueue();
  const sc = SCENES.find(x => x.id === P.sc), tk = P.tk.t === 'x' ? SITS.find(x => x.id === P.tk.id) : PLACES.find(x => x.id === P.tk.id);
  const nRev = rq.due.length, nNew = Math.min(5, rq.fresh.length), canRev = nRev + nNew > 0;

    { t: 'Apprendre : ' + sc.t, d: 'Leçon animée · ' + MOD(sc.m).n, href: '#s/' + sc.id, min: 5 },

  const nd = day.done.length, sk = streak(), tot = Object.keys(S.sd).filter(sdDone).length, a = revQueue();
  const pd = PIED.reduce((n, w, i) => n + w.s.filter((x, j) => S.pp[`w${i + 1}s${j + 1}`]).length, 0), pt = PIED.reduce((n, w) => n + w.s.length, 0);
  app.innerHTML = `<div class="brand"><h1>Séance</h1></div>
  <p class="mut">Environ 25 minutes. Fais au moins 3 étapes sur 4 pour valider ta séance.</p>
  <div class="card hero" style="margin-top:10px"><div class="pct">${sk}</div><div style="flex:1"><b>${sk > 0 ? plural(sk, 'jour de suite', 'jours de suite') : 'Commence ta série'}</b><div class="small mut">${tot} séance${plural(tot, '', 's')} validée${plural(tot, '', 's')} · aujourd'hui ${nd}/4</div><div class="bar" style="margin-top:8px"><i style="width:${nd * 25}%"></i></div></div></div>
  <h2>Ma séance du jour</h2>

  <div class="list">${steps.map((s, i) => `<div class="row" style="padding:6px 12px 6px 4px"><button class="tick" data-i="${i}" aria-pressed="${day.done.includes(i)}" aria-label="${day.done.includes(i) ? 'Étape faite' : 'Marquer comme faite'} : ${esc(s.t)}"><span class="chk ${day.done.includes(i) ? 'on' : ''}">✓</span></button>${s.href ? `<a class="tx" href="${s.href}" style="padding:6px 0"><b>${esc(s.t)}</b><span>${esc(s.d)}</span></a><span class="st" aria-hidden="true">›</span>` : `<div class="tx" style="padding:6px 0"><b>${s.t}</b><span style="font-size:15px;color:var(--ink);line-height:1.35">${s.d}</span></div>`}</div>`).join('')}</div>
  ${nd >= 3 ? `<div class="fb" style="border-color:var(--ok)"><b>Séance validée !</b><p>${nd === 4 ? 'Les quatre étapes sont faites. ' : ''}Reviens demain pour continuer ta série.</p></div>` : ''}
  ${nd === 0 ? '<button class="btn full" id="rr">↺ Une autre séance</button>' : ''}
  <h2>Aller plus loin</h2>
  <div class="list">
    <a class="row" href="#revision"><span class="tx"><b>Révision espacée</b><span>${a.due.length} à revoir · ${a.fresh.length} nouvelle${plural(a.fresh.length, '', 's')} · ${revMastered()} maîtrisée${plural(revMastered(), '', 's')}</span></span><span class="st">›</span></a>
    <a class="row" href="#pied"><span class="tx"><b>Programme jeu au pied</b><span>4 semaines · ${pd}/${pt} séances faites</span></span><span class="st">›</span></a>
    <a class="row" href="#carnet"><span class="tx"><b>Carnet d'après-match</b><span>${S.cn.length} match${plural(S.cn.length, '', 's')} noté${plural(S.cn.length, '', 's')}</span></span><span class="st">›</span></a>
  </div>
  <h2>Mental et règles</h2>
  <div class="list">
    <a class="row" href="#routine"><span class="tx"><b>Routine d'avant-match</b><span>${roToday()} geste${plural(roToday(), '', 's')} fait${plural(roToday(), '', 's')} aujourd'hui</span></span><span class="st">›</span></a>
    <a class="row" href="#ecrans"><span class="tx"><b>Écrans et téléphone</b><span>Avant un match ou un entraînement</span></span><span class="st">›</span></a>
    <a class="row" href="#erreur"><span class="tx"><b>Après une erreur</b><span>Ma routine en 4 temps · ${ERREUR.scen.length} mises en situation</span></span><span class="st">›</span></a>
    <a class="row" href="#lexique"><span class="tx"><b>Mon lexique</b><span>${LEX.length + S.lxn.length} mots-clés pour ta défense</span></span><span class="st">›</span></a>
    <a class="row" href="#regles"><span class="tx"><b>Règles du gardien</b><span>${S.qz.regles != null ? 'Record ' + S.qz.regles + ' %' : RULES.length + ' questions sur les lois du jeu'}</span></span><span class="st">›</span></a>
    <a class="row" href="#video"><span class="tx"><b>Analyse vidéo guidée</b><span>${S.av.length} analyse${plural(S.av.length, '', 's')} enregistrée${plural(S.av.length, '', 's')}</span></span><span class="st">›</span></a>
  </div>`;
  app.querySelectorAll('.tick').forEach(b => b.onclick = () => { const i = +b.dataset.i, j = day.done.indexOf(i); if (j < 0) day.done.push(i); else day.done.splice(j, 1); save(); vSeance(); });
  const rr = $('#rr'); if (rr) rr.onclick = () => { day.r++; day.plan = makePlan(dnum() * 31 + day.r); save(); vSeance(); };
}

/* ---------- programme jeu au pied ---------- */
function vPied(open) {

  const tot = PIED.reduce((n, w) => n + w.s.length, 0), dn = PIED.reduce((n, w, i) => n + wd(i), 0);
  let cur = PIED.findIndex((w, i) => wd(i) < w.s.length); if (cur < 0) cur = 0;
  open = open == null || isNaN(+open) ? cur : +open;
  app.innerHTML = hdr('seance', 'Programme', 'Jeu au pied') + `
  <div class="card"><p style="margin:0 0 8px">4 semaines, 3 séances de 20 minutes. Avance à ton rythme.</p><div class="bar"><i style="width:${Math.round(100 * dn / tot)}%"></i></div><p class="mut small" style="margin:6px 0 0">${dn} séance${plural(dn, '', 's')} sur ${tot}</p></div>
  <div class="list" style="margin-top:12px">${PIED.map((w, i) => `<details class="card" ${i === open ? 'open' : ''}><summary><span><span class="mut small" style="display:block">Semaine ${w.w} · ${wd(i)}/${w.s.length}</span>${w.t}</span></summary>
    <div style="padding:0 14px 14px"><p class="mut small">${w.obj}</p>
    ${w.s.map((s, j) => `<div class="card" style="background:var(--card2);margin-bottom:8px"><b>${s.t}</b><ul style="margin:8px 0 10px;padding-left:20px">${s.items.map(x => `<li>${x}</li>`).join('')}</ul><button class="btn ${S.pp[pk(i, j)] ? '' : 'pri'} full" style="margin-top:0" data-pp="${pk(i, j)}" data-w="${i}">${S.pp[pk(i, j)] ? '✓ Séance faite (annuler)' : 'J\'ai fait cette séance'}</button></div>`).join('')}
    <div class="card" style="background:var(--card2)"><b>Test de la semaine</b><p class="small" style="margin:6px 0 8px">${w.test.q}</p>
      <div style="display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center"><button class="btn" data-pt="${i}" data-d="-1" aria-label="Moins">−</button><div style="text-align:center"><span class="big" style="font-size:40px">${S.pt[w.w] == null ? '–' : S.pt[w.w]}</span><span class="mut"> / ${w.test.max}</span></div><button class="btn" data-pt="${i}" data-d="1" aria-label="Plus">+</button></div>
      ${S.pt[w.w] != null && i > 0 && S.pt[PIED[i - 1].w] != null && PIED[i - 1].test.max === w.test.max ? `<p class="small mut" style="margin:8px 0 0">Semaine précédente : ${S.pt[PIED[i - 1].w]} / ${w.test.max}</p>` : ''}</div></div></details>`).join('')}</div>
  <p class="mut small" style="margin-top:12px">Si tu as mal, arrête. Les consignes de ton entraîneur de gardiens passent toujours en premier.</p>`;

  app.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { const i = +b.dataset.pt, w = PIED[i], v = S.pt[w.w] == null ? (+b.dataset.d > 0 ? 0 : 1) : S.pt[w.w]; S.pt[w.w] = Math.max(0, Math.min(w.test.max, v + +b.dataset.d)); save(); vPied(i); });
}

/* ---------- carnet d'après-match ---------- */
const RES = { V: 'Victoire', N: 'Nulle', D: 'Défaite' }, ATT = { o: 'Oui', p: 'En partie', n: 'Non' };
const segH = (name, vals, cur, c3) => `<div class="seg ${c3 ? 'c3' : ''}" role="group" data-seg="${name}">${vals.map(([v, l]) => `<button type="button" class="btn ${String(cur) === String(v) ? 'on' : ''}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;

function vCarnet(b) {
  if (b === 'new') return vCarnetForm();
  const L = S.cn, lastN = L.slice(0, 5), last = L[0];
  const avg = id => { const v = lastN.map(e => e.rt && e.rt[id]).filter(Boolean); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : 0; };
  app.innerHTML = hdr('seance', 'Après chaque match', 'Mon carnet') + `
  <a class="btn pri full" href="#carnet/new" style="margin-top:0">+ Nouveau match</a>
  ${last && last.obj ? `<div class="card" style="margin-top:12px;border-left:5px solid var(--acc)"><div class="mut small">Ton objectif pour le prochain match</div><p style="margin:4px 0 0;font-size:17px">${esc(last.obj)}</p></div>` : ''}
  ${L.length ? `<h2>Mes 5 derniers matchs</h2><div class="card">${CARNET.crit.map(c => { const v = avg(c.id); return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span>${c.n}</span><b>${v ? v.toFixed(1).replace('.', ',') + ' / 5' : '–'}</b></div><div class="bar" style="margin-top:4px"><i style="width:${v * 20}%"></i></div></div>`; }).join('')}<p class="mut small" style="margin:0">${L.length < 3 ? 'Note quelques matchs de plus pour voir ta progression.' : 'Une note basse n\'est pas un échec : c\'est ton prochain objectif.'}</p></div>
  <h2>Mes matchs</h2><div class="list">${L.map(e => `<details class="card"><summary><span><span class="mut small" style="display:block">${frDate(e.d)}${e.res ? ' · ' + RES[e.res] : ''}</span>${e.opp ? 'Contre ' + esc(e.opp) : 'Match'}</span></summary>
    <div style="padding:0 14px 14px">${CARNET.crit.filter(c => e.rt && e.rt[c.id]).map(c => `<p style="margin:0 0 4px"><span class="mut">${c.n} :</span> <b>${e.rt[c.id]} / 5</b></p>`).join('')}
    ${['bien', 'trav', 'err', 'obj'].filter(f => e[f]).map(f => `<p style="margin:10px 0 0"><span class="mut small" style="display:block">${CARNET.q[f]}</span>${esc(e[f])}</p>`).join('')}
    ${e.att ? `<p style="margin:10px 0 0"><span class="mut">Objectif précédent atteint :</span> <b>${ATT[e.att]}</b></p>` : ''}
    <button class="btn full" data-del="${e.id}" style="min-height:44px">Supprimer ce match</button><div data-cf="${e.id}"></div></div></details>`).join('')}</div>
  <button class="btn full" id="cp">Copier le carnet pour mon entraîneur</button><div id="cpr"></div>` : '<p class="mut" style="margin-top:14px">Rien encore. Après ton prochain match, prends 3 minutes pour le noter. Le carnet reste sur cet appareil.</p>'}`;
  app.querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.del, box = app.querySelector(`[data-cf="${id}"]`);
    box.innerHTML = '<div class="ctl" style="grid-template-columns:1fr 1fr"><button class="btn" data-n="1">Annuler</button><button class="btn pri" data-y="1">Oui, supprimer</button></div>';
    box.querySelector('[data-n]').onclick = () => box.innerHTML = '';
    box.querySelector('[data-y]').onclick = () => { S.cn = S.cn.filter(e => String(e.id) !== id); save(); vCarnet(); };
  });
  const cp = $('#cp');
  if (cp) cp.onclick = () => {
    const txt = L.slice().reverse().map(e => `${frDate(e.d)}${e.res ? ' · ' + RES[e.res] : ''}${e.opp ? ' · contre ' + e.opp : ''}\n` + CARNET.crit.filter(c => e.rt && e.rt[c.id]).map(c => `${c.n} : ${e.rt[c.id]}/5`).join('\n') + ['bien', 'trav', 'err', 'obj'].filter(f => e[f]).map(f => `\n${CARNET.q[f]} : ${e[f]}`).join('')).join('\n\n');
    const ok = () => $('#cpr').innerHTML = '<p class="small" style="color:var(--ok)">Copié ✓</p>';
    const fb = () => { $('#cpr').innerHTML = `<textarea readonly id="cpt" aria-label="Carnet à copier" style="min-height:140px;margin-top:8px">${esc(txt)}</textarea>`; $('#cpt').select(); };
    try { navigator.clipboard.writeText(txt).then(ok, fb); } catch (e) { fb(); }
  };
}

function vCarnetForm() {
  const D = S.cd, last = S.cn[0], rt = D.rt || (D.rt = {});
  const ta = (f, rows) => `<label class="lab" for="f-${f}">${CARNET.q[f]}</label><textarea id="f-${f}" data-f="${f}" maxlength="300" rows="${rows || 2}">${esc(D[f] || '')}</textarea>`;

  ${ta('obj')}
  <button class="btn pri full" id="sv" ${D.res ? '' : 'disabled'}>Enregistrer</button>
  <p class="mut small" id="svh" style="margin-top:6px">${D.res ? '' : 'Choisis d\'abord le résultat du match.'}</p>`;
  app.querySelectorAll('[data-f]').forEach(el => el.oninput = () => { D[el.dataset.f] = el.value; save(); });
  app.querySelectorAll('[data-seg]').forEach(g => [...g.children].forEach(b => b.onclick = () => {
    const n = g.dataset.seg, v = b.dataset.v;
    if (n.startsWith('rt-')) rt[n.slice(3)] = +v; else D[n] = v;
    [...g.children].forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });

    save();
  }));

    if (D.att) e.att = D.att;
    S.cn.unshift(e); S.cd = {}; save(); location.hash = '#carnet';

/* =====================================================================
   LOT D — lexique, routine d'avant-match, erreur, règles, analyse vidéo
   ===================================================================== */
const lxWord = x => (S.lx[x.id] || '').trim() || x.w;
const chipH = (name, vals, cur) => `<div class="chips" data-chip="${name}">${vals.map(v => `<button type="button" class="chip ${cur === v ? 'on' : ''}" aria-pressed="${cur === v}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
const segD = (name, vals, cur, cls) => `<div class="seg ${cls}" role="group" data-seg="${name}">${vals.map(([v, l]) => `<button type="button" class="btn ${cur === v ? 'on' : ''}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>`;
const EXTRA = {
  m4: [['#regles', 'Règles du gardien', 'Les 8 secondes et les autres lois']],
  m8: [['#regles', 'Règles du gardien', 'Penalty, coup de pied de but, quiz']],
  m9: [['#lexique', 'Mon lexique', 'Tes mots-clés, en français et en anglais'], ['#erreur', 'Après une erreur', 'Ma routine en 4 temps'], ['#routine', "Routine d'avant-match", 'Du sac à la veille jusqu\'au coup d\'envoi']]
};
const roToday = () => S.ro.d === keyOf(dnum()) ? S.ro.done.length : 0;

/* quiz simple en plusieurs questions : qs au format QUIZ (première option = bonne) */
function miniQuiz(qs, o) {
  qs = shuffle(qs); let i = 0, score = 0;
  const ask = () => {
    const q = qs[i], opts = shuffle(q.o.map((t, j) => ({ t, ok: j === 0 })));
    app.innerHTML = hdr(o.back, o.small, `Question ${i + 1} / ${qs.length}`) + `
    <div class="bar" style="margin-bottom:14px"><i style="width:${100 * i / qs.length}%"></i></div>
    <p style="font-size:19px;line-height:1.35;font-weight:600">${q.q}</p>
    <div id="os">${opts.map((x, j) => `<button class="opt" data-j="${j}">${x.t}</button>`).join('')}</div><div id="res"></div>`;
    [...$('#os').children].forEach((b, j) => b.onclick = () => {
      if ($('#res').innerHTML) return;
      const good = opts[j].ok; if (good) score++;
      [...$('#os').children].forEach((x, k) => { if (opts[k].ok) x.classList.add('ok'); else if (k === j) x.classList.add('bad'); x.disabled = true; });
      $('#res').innerHTML = `<div class="fb" style="border-color:var(--${good ? 'ok' : 'bad'})"><b>${good ? 'Bien joué !' : 'Pas tout à fait'}</b><p>${q.w}</p></div><button class="btn pri full" id="nq">${i === qs.length - 1 ? 'Voir mon résultat' : 'Question suivante →'}</button>`;
      $('#nq').onclick = () => { i++; i < qs.length ? ask() : end(); window.scrollTo(0, 0); };
      $('#nq').scrollIntoView({ block: 'nearest', behavior: noMotion ? 'auto' : 'smooth' });
    });
  };
  const end = () => {
    const pct = Math.round(100 * score / qs.length); o.done(pct);
    app.innerHTML = hdr(o.back, o.small, 'Résultat') + `
    <div class="card" style="text-align:center;padding:28px 14px"><div class="big">${score}/${qs.length}</div><p style="margin-top:10px">${o.msg(pct)}</p></div>
    <div class="ctl" style="grid-template-columns:1fr 1fr"><button class="btn" id="re">↺ Refaire</button><a class="btn pri" href="#${o.back}">Continuer →</a></div>`;
    $('#re').onclick = () => { miniQuiz(qs, o); window.scrollTo(0, 0); };
  };
  ask();
}

/* ---------- 3 · lexique personnalisable ---------- */
function vLexique(b) {
  if (b === 'test') return lexTest();
  if (b === 'test-en') return lexTest(true);
  const own = S.lxn;
  app.innerHTML = hdr('seance', 'Ton équipe, tes mots', 'Mon lexique') + `
  <div class="card"><p style="margin:0">Les mots doivent être les mêmes pour toute ton équipe. Si ton entraîneur en utilise d'autres, remplace-les ici. Tu peux aussi ajouter les tiens.</p></div>
  <div class="ctl" style="grid-template-columns:1fr 1fr;margin-top:12px"><a class="btn pri" href="#lexique/test">Me tester</a><a class="btn" href="#lexique/test-en">Test en anglais</a></div>
  <div class="card" style="margin-top:12px"><p class="small" style="margin:0"><span class="lvl l1">EN</span> ${LEX_EN_NOTE}</p></div>
  <h2>Les mots de base</h2>
  <div class="list">${LEX.map(x => `<div class="card"><div class="lxh"><b class="lxw">${esc(lxWord(x))}</b><button class="btn lxb" data-ed="${x.id}" aria-expanded="false">Changer</button></div>
    <p style="margin:6px 0 2px">${x.s}</p><p class="mut small" style="margin:0">${x.q}</p>
    <p class="small" style="margin:10px 0 0"><span class="lvl l1">EN</span> <b>${esc(x.en[0])}</b>${x.en.length > 1 ? ` <span class="mut">ou ${esc(x.en.slice(1).join(', '))}</span>` : ''}</p><div data-ef="${x.id}"></div></div>`).join('')}</div>
  <h2>D'autres mots en anglais</h2>
  <div class="list">${LEX_EN_EXTRA.map(x => `<div class="card"><div class="lxh"><b class="lxw">${esc(x.w)}</b></div><p style="margin:6px 0 2px">${x.s}</p><p class="mut small" style="margin:0">${x.q}</p></div>`).join('')}</div>
  <h2>Mes mots à moi</h2>
  ${own.length ? `<div class="list">${own.map(t => `<div class="card"><div class="lxh"><b class="lxw">${esc(t.w)}</b><button class="btn lxb" data-rm="${t.id}" aria-label="Retirer ${esc(t.w)}">Retirer</button></div>${t.s ? `<p style="margin:6px 0 0">${esc(t.s)}</p>` : ''}</div>`).join('')}</div>` : '<p class="mut small">Aucun pour l\'instant. Ajoute un mot que ton équipe utilise déjà.</p>'}
  ${own.length < 10 ? `<label class="lab" for="n-w">Nouveau mot</label><input type="text" id="n-w" maxlength="20"><label class="lab" for="n-s">Ce que ça veut dire</label><input type="text" id="n-s" maxlength="80"><button class="btn full" id="n-ok" disabled>Ajouter</button>` : ''}`;
  app.querySelectorAll('[data-ed]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.ed, x = LEX.find(l => l.id === id), box = app.querySelector(`[data-ef="${id}"]`);
    if (box.innerHTML) { box.innerHTML = ''; btn.setAttribute('aria-expanded', 'false'); return; }
    btn.setAttribute('aria-expanded', 'true');
    box.innerHTML = `<label class="lab" for="e-${id}">Ton mot pour « ${esc(x.w)} »</label><input type="text" id="e-${id}" maxlength="20" value="${esc(S.lx[id] || '')}" placeholder="${esc(x.w)}"><button class="btn full" data-rs style="min-height:44px">Remettre le mot d'origine</button>`;
    const inp = box.querySelector('input'), wEl = btn.parentNode.querySelector('.lxw');
    inp.oninput = () => { const v = inp.value.trim(); if (v) S.lx[id] = v; else delete S.lx[id]; save(); wEl.textContent = lxWord(x); };
    box.querySelector('[data-rs]').onclick = () => { delete S.lx[id]; save(); inp.value = ''; wEl.textContent = x.w; };
    inp.focus();
  });
  app.querySelectorAll('[data-rm]').forEach(btn => btn.onclick = () => { S.lxn = S.lxn.filter(t => String(t.id) !== btn.dataset.rm); save(); vLexique(); });
  const nw = $('#n-w'), ns = $('#n-s'), nok = $('#n-ok');
  if (nok) { nw.oninput = () => nok.disabled = !nw.value.trim(); nok.onclick = () => { S.lxn.push({ id: Date.now(), w: nw.value.trim(), s: ns.value.trim() }); save(); vLexique(); }; }
}
function lexTest(en) {
  const L = shuffle(en ? LEX.map(x => ({ w: x.en[0], alt: x.en.slice(1), s: x.s, q: x.q })) : LEX.map(x => ({ w: lxWord(x), s: x.s, q: x.q })).concat(S.lxn.map(t => ({ w: t.w, s: t.s, q: '' }))));
  let i = 0, ok = 0;
  const show = () => {
    const x = L[i];
    app.innerHTML = hdr('lexique', 'Me tester', `Mot ${i + 1} / ${L.length}`) + `<div class="bar" style="margin-bottom:14px"><i style="width:${100 * i / L.length}%"></i></div>
    <div class="card"><p class="mut small" style="margin:0 0 4px">${en ? 'Quel mot dis-tu en anglais pour ça ?' : 'Quel mot dis-tu pour ça ?'}</p><p style="font-size:20px;line-height:1.35;font-weight:600;margin:0">${esc(x.s || x.q || 'Un de tes mots à toi')}</p>${x.s && x.q ? `<p class="mut" style="margin:8px 0 0">${esc(x.q)}</p>` : ''}</div>
    <div id="rv"></div><button class="btn pri full" id="sh">Voir le mot</button>`;
    $('#sh').onclick = () => {
      $('#sh').remove();
      $('#rv').innerHTML = `<div class="card" style="text-align:center;margin-top:10px"><span class="lxw" style="font-size:34px">${esc(x.w)}</span>${x.alt && x.alt.length ? `<p class="mut small" style="margin:6px 0 0">ou ${esc(x.alt.join(', '))}</p>` : ''}</div><div class="ctl" style="grid-template-columns:1fr 1fr"><button class="btn" id="no">Pas encore</button><button class="btn pri" id="yes">Je le savais</button></div>`;
      const nx = g => () => { if (g) ok++; i++; i < L.length ? show() : fin(); window.scrollTo(0, 0); };
      $('#no').onclick = nx(0); $('#yes').onclick = nx(1);
    };
  };
  const fin = () => {
    app.innerHTML = hdr('lexique', 'Me tester', 'Résultat') + `<div class="card" style="text-align:center;padding:28px 14px"><div class="big">${ok}/${L.length}</div><p style="margin-top:10px">${ok === L.length ? 'Tu connais tous tes mots.' : 'Relis ceux que tu ne savais pas, puis réessaie demain.'}</p></div>
    <div class="ctl" style="grid-template-columns:1fr 1fr"><button class="btn" id="re">↺ Refaire</button><a class="btn pri" href="#lexique">Mon lexique →</a></div>`;
    $('#re').onclick = () => lexTest(en);
  };
  show();
}

/* ---------- 9 · routine d'avant-match ---------- */
function vRoutine() {
  const k = keyOf(dnum()); if (S.ro.d !== k) S.ro = { d: k, done: [] };
  const P = S.rp, last = S.cn[0];
  const ids = ROUTINE.reduce((a, r) => a.concat(r.items.map((_, j) => r.id + j)), []), nd = S.ro.done.filter(x => ids.includes(x)).length;
  app.innerHTML = hdr('seance', 'Avant chaque match', 'Ma routine') + `
  <div class="card hero" style="margin-top:0"><div class="pct">${nd}</div><div style="flex:1"><b>sur ${ids.length} gestes faits aujourd'hui</b><div class="bar" style="margin-top:8px"><i style="width:${Math.round(100 * nd / ids.length)}%"></i></div></div></div>
  <h2>Ma routine à moi</h2>
  <p class="mut small">Trois choses à toi, toujours pareilles.</p>
  ${Object.keys(ROUTINE_PERSO).map(f => `<label class="lab" for="p-${f}">${ROUTINE_PERSO[f]}</label><input type="text" id="p-${f}" data-p="${f}" maxlength="80" value="${esc(P[f] || '')}">`).join('')}
  ${last && last.obj && !P.obj ? `<p class="small mut" style="margin:6px 0 0">Dans ton carnet : « ${esc(last.obj)} » <button class="btn" id="useobj" style="display:inline-flex;min-height:44px;font-size:14px;margin-left:6px">Utiliser</button></p>` : ''}
  ${ROUTINE.map(r => `<h2>${r.t}</h2><p class="mut small" style="margin-top:-6px">${r.q}</p><div class="list">${r.items.map((t, j) => { const id = r.id + j, on = S.ro.done.includes(id); return `<div class="row" style="padding:6px 12px 6px 4px;min-height:0"><button class="tick" data-id="${id}" aria-pressed="${on}" aria-label="${on ? 'Fait' : 'Marquer comme fait'} : ${esc(t)}"><span class="chk ${on ? 'on' : ''}">✓</span></button><div class="tx" style="padding:6px 0"><span style="font-size:15px;color:var(--ink);line-height:1.35">${t}</span></div></div>`; }).join('')}</div>`).join('')}
  <button class="btn full" id="rz2">Tout décocher</button>
  <a class="row" href="#ecrans" style="margin-top:12px"><span class="tx"><b>Écrans et téléphone</b><span>Pourquoi ranger ton téléphone avant le match</span></span><span class="st">›</span></a>
  <p class="mut small" style="margin-top:12px">C'est une base. Si ton entraîneur a sa propre routine, suis la sienne en premier.</p>`;
  const keep = () => { const y = scrollY; vRoutine(); scrollTo(0, y); };
  app.querySelectorAll('[data-p]').forEach(el => el.oninput = () => { S.rp[el.dataset.p] = el.value; save(); });
  const uo = $('#useobj'); if (uo) uo.onclick = () => { S.rp.obj = last.obj; save(); keep(); };
  app.querySelectorAll('.tick').forEach(b => b.onclick = () => { const id = b.dataset.id, j = S.ro.done.indexOf(id); if (j < 0) S.ro.done.push(id); else S.ro.done.splice(j, 1); save(); keep(); });
  $('#rz2').onclick = () => { S.ro.done = []; save(); keep(); };
}

/* ---------- 11 · gestion de l'erreur ---------- */
function vErreur(b) {
  if (b === 'quiz') return miniQuiz(ERREUR.scen, { back: 'erreur', small: 'Mises en situation', done: p => { if (p > (S.es || 0)) { S.es = p; save(); } }, msg: p => p === 100 ? 'Sans faute. Tu gardes la tête froide.' : p >= 70 ? 'Solide. Relis ta routine avant ton prochain match.' : 'Relis les 4 temps de ta routine, puis réessaie.' });
  const E = S.er;
  app.innerHTML = hdr('seance', 'Après un but ou une erreur', "L'erreur") + `
  <div class="card" style="border-left:5px solid var(--bad)"><p style="margin:0">Tous les gardiens font des erreurs, même les meilleurs. Ce qui compte, c'est ce que tu fais dans les 10 secondes qui suivent. Une routine courte, toujours la même, te ramène dans le match.</p></div>
  <h2>Ma routine en 4 temps</h2>
  <div class="list">${ERREUR.steps.map((s, i) => `<div class="card" style="display:flex;gap:12px;align-items:flex-start"><span class="big" style="font-size:34px">${i + 1}</span><div><b>${s.t}</b><div class="mut small">${s.d}</div></div></div>`).join('')}</div>
  <h2>Mon geste</h2>${chipH('g', ERREUR.gestes, E.g)}
  <label class="lab" for="e-g">Ou écris le tien</label><input type="text" id="e-g" maxlength="40" value="${esc(E.g || '')}">
  <h2>Mon mot</h2>${chipH('m', ERREUR.mots, E.m)}
  <label class="lab" for="e-m">Ou écris le tien</label><input type="text" id="e-m" maxlength="40" value="${esc(E.m || '')}">
  <button class="btn pri full" id="go">▶ Répéter ma routine</button><div id="run" style="margin-top:10px"></div>
  <h2>Pour t'entraîner</h2>
  <div class="list"><a class="row" href="#erreur/quiz"><span class="tx"><b>Mises en situation</b><span>${ERREUR.scen.length} questions : que fais-tu ?</span></span><span class="st">${S.es != null ? S.es + ' %' : 'À faire'}</span></a>
  <a class="row" href="#carnet"><span class="tx"><b>Mon carnet d'après-match</b><span>Écris l'erreur et ce que tu en retiens</span></span><span class="st">›</span></a></div>`;
  const sync = n => app.querySelectorAll(`[data-chip="${n}"] .chip`).forEach(c => { const on = c.dataset.v === (E[n] || ''); c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
  ['g', 'm'].forEach(n => {
    const inp = $('#e-' + n);
    inp.oninput = () => { E[n] = inp.value.trim(); save(); sync(n); };
    app.querySelectorAll(`[data-chip="${n}"] .chip`).forEach(c => c.onclick = () => { E[n] = c.dataset.v; inp.value = E[n]; save(); sync(n); });

/* ---------- accès par mot de passe (barrière simple, côté appareil) ---------- */
function sha256(str) {
  const enc = new TextEncoder().encode(str), l = enc.length, n = ((l + 9 + 63) >> 6) << 6, b = new Uint8Array(n);
  b.set(enc); b[l] = 0x80;
  const dv = new DataView(b.buffer); dv.setUint32(n - 4, (l * 8) >>> 0); dv.setUint32(n - 8, Math.floor(l * 8 / 4294967296));
  const K = [], H = []; let c = 0;
  for (let p = 2; c < 64; p++) { let pr = true; for (let d = 2; d * d <= p; d++) if (p % d === 0) { pr = false; break; } if (pr) { K[c] = (Math.cbrt(p) % 1 * 4294967296) | 0; if (c < 8) H[c] = (Math.sqrt(p) % 1 * 4294967296) | 0; c++; } }
  const w = new Int32Array(64), rr = (x, k) => (x >>> k) | (x << (32 - k));
  for (let i = 0; i < n; i += 64) {
    for (let j = 0; j < 16; j++) w[j] = dv.getInt32(i + j * 4);
    for (let j = 16; j < 64; j++) { const a = w[j - 15], d = w[j - 2]; w[j] = (w[j - 16] + (rr(a, 7) ^ rr(a, 18) ^ (a >>> 3)) + w[j - 7] + (rr(d, 17) ^ rr(d, 19) ^ (d >>> 10))) | 0; }
    let [A, B, C, D, E, F, G, Q] = H;
    for (let j = 0; j < 64; j++) {
      const t1 = (Q + (rr(E, 6) ^ rr(E, 11) ^ rr(E, 25)) + ((E & F) ^ (~E & G)) + K[j] + w[j]) | 0, t2 = ((rr(A, 2) ^ rr(A, 13) ^ rr(A, 22)) + ((A & B) ^ (A & C) ^ (B & C))) | 0;
      Q = G; G = F; F = E; E = (D + t1) | 0; D = C; C = B; B = A; A = (t1 + t2) | 0;
    }
    [A, B, C, D, E, F, G, Q].forEach((v, j) => H[j] = (H[j] + v) | 0);
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}

  app.innerHTML = hdr('seance', 'Avant un match ou un entraînement', 'Écrans et téléphone') + `
  <div class="card"><p style="margin:0">${ECRANS.intro}</p></div>
  <h2>Pourquoi</h2>
  <div class="card">${li(ECRANS.pourquoi)}</div>
  <h2>Ton plan</h2>
  <div class="list">${ECRANS.plan.map((p, i) => `<details class="card" ${i === 2 ? 'open' : ''}><summary>${p.t}</summary><div style="padding:0 14px 14px">${li(p.l)}</div></details>`).join('')}</div>
  <h2>Le sommeil</h2>
  <div class="card">${li(ECRANS.sommeil)}</div>
  <a class="row" href="#routine" style="margin-top:12px"><span class="tx"><b>Ma routine d'avant-match</b><span>Les gestes « écrans » y sont déjà, à cocher</span></span><span class="st">›</span></a>
  <h2>Sources</h2>
  <div class="list">${ECRANS.src.map(s => `<a class="row" href="${s[1]}" target="_blank" rel="noopener noreferrer"><span class="tx"><span style="color:var(--ink);font-size:15px">${s[0]}</span></span><span class="st" aria-hidden="true">↗</span></a>`).join('')}</div>`;
}

let prevA = null, vidBack = 'home';
function route() {
  stopAll();
  if (!accOK()) { vLock(); return; }
  document.body.classList.remove('locked');
  const [a, b] = location.hash.slice(1).split('/');
  if (a === 'video' && prevA !== 'video') vidBack = prevA === 'seance' ? 'seance' : 'home';
  prevA = a;
  ({ m: vModule, s: vScene, p: vPlace, x: vSit, q: vQuiz, defis: vDefis, progres: vProg, niv: vNiveau, seance: vSeance, revision: vRevision, pied: vPied, carnet: vCarnet, lexique: vLexique, routine: vRoutine, erreur: vErreur, regles: vRegles, video: vVideo, ecrans: vEcrans, physique: vPhysique, nutrition: vNutrition }[a] || vHome)(b);
  const tab = a === 'defis' || a === 'regles' || a === 'p' || a === 'x' || (a === 'q' && b === 'all') ? 'defis' : a === 'progres' ? 'progres' : a === 'physique' ? 'physique' : a === 'nutrition' ? 'nutrition' : ['seance', 'revision', 'pied', 'carnet', 'lexique', 'routine', 'erreur', 'ecrans'].includes(a) || (a === 'video' && vidBack === 'seance') ? 'seance' : 'home';
  document.querySelectorAll('nav a').forEach(x => x.classList.toggle('on', x.dataset.t === tab));
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
